name: Gerar Resumo Diario do Trabalho

on:
  schedule:
    # Roda de segunda a sexta às 19:00 BRT (22:00 UTC)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Permite rodar manualmente clicando em um botão

jobs:
  rodar-automacao:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Baixa o histórico do Git para podermos ler o que mudou

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Bibliotecas
        run: pip install google-generativeai requests

      - name: Executar Script Python
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python .github/scripts/gerar_resumo.py
